.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr))}

.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}

/* ---------- alerts ---------- */
function test(r, v){ return r.op==="<" ? v < r.value : r.op===">" ? v > r.value : r.op===">=" ? v >= r.value : false; }
function fmtVal(r, v){ return r.unit==="%" ? v.toFixed(1)+"%" : r.unit==="天" ? Math.round(v)+" 天" : v+" "+r.unit; }
function computeAlerts(){
  const out=[]; const m=S.month;
  const add=(rid, asin, v, period, extra="")=>{
    const r=rule(rid); if(!r.on || v==null || !isFinite(v) || !test(r,v)) return;
    out.push({key:`${period.replace(/-/g,"")}_${asin}_${rid}`, rid, asin, line:asinInfo[asin].line,
      rule:r, value:fmtVal(r,v), threshold:`${r.op===">="?"≥":r.op} ${r.value}${r.unit==="%"?"%":" "+r.unit}`, period, extra});
  };
  const lastW = DATA.weeks[DATA.weeks.length-1].week;
  DATA.asins.filter(a=>inLine(a.asin)).forEach(({asin})=>{
    const i=invOf[asin]; const d=invDays(i); const p="INV"+i.date;
    add("stock_low",asin,d,p,`可用 ${int.format(i.avail)} 件 · 日均 ${i.daily30.toFixed(1)}`);
    add("stock_high",asin,d,p,`可用 ${int.format(i.avail)} 件 · 日均 ${i.daily30.toFixed(1)}`);
    const ws=weeksOf(asin); const prev=ws.slice(0,4).reduce((t,w)=>t+w.units,0), last=ws.slice(4).reduce((t,w)=>t+w.units,0);
    if(prev>=28) add("sales_drop",asin,(prev-last)/prev*100,lastW,`前 4 周日均 ${(prev/28).toFixed(1)} → 近 4 周 ${(last/28).toFixed(1)}`);
    const ly=lyMonth(m); if(ly){ const c=asinMonth(asin,m), o=asinMonth(asin,ly);
      if(o.sales>=1000) add("yoy_drop",asin,(1-(c.sales/daysIn(m))/(o.sales/daysIn(ly)))*100,m,`去年同月日均 ${usd0.format(o.sales/daysIn(ly))} → ${usd0.format(c.sales/daysIn(m))}`); }
    const t=target(asin), lw=ws[ws.length-1];
    if(t.confirmed) add("daily_miss",asin,Math.round(lw.daily/t.daily*1000)/10,lastW,`${lw.daily.toFixed(1)} 单/天 · 目标 ${t.daily}`);
    if(t.confirmed && t.rank){ let streak=0; for(let k=ws.length-1;k>=0 && ws[k].rank && ws[k].rank>t.rank;k--) streak++;
      add("rank_miss",asin,streak,lastW,`最新周均 #${lw.rank} · 目标 #${t.rank}`); }
  });
  const order={high:0,mid:1};
  return out.sort((a,b)=>order[a.rule.level]-order[b.rule.level] || LINES.indexOf(a.line)-LINES.indexOf(b.line));
}

  const rows = ls.map(l=>{

    const core = DATA.asins.filter(a=>a.line===l).reduce((t,a)=>t+asinMonth(a.asin,m).sales,0);

    <div class="card"><h3>月度销售额：2026 vs 2025</h3><p class="note">每个品线单独纵轴；浅色为 2025 年，深色为 2026 年；${+END.slice(5,7)} 月为 1–${+END.slice(8)} 日数据。</p>
      <div class="yoy-legend"><span><i style="background:var(--line)"></i>2025 年</span><span><i style="background:var(--fg)"></i>2026 年（按品线颜色）</span></div>
      <div class="minis">${minis}</div></div>

function yoyChart(l){
  const W=300,H=130,pb=18,pt=10,slot=W/12,bw=Math.min(9,slot/2-2);
  const v=(y,mm)=>{ const r=lmIdx[l+"|"+y+"-"+String(mm).padStart(2,"0")]; return r?r.sales:null; };
  let max=0; for(let mm=1;mm<=12;mm++){ max=Math.max(max,v(2025,mm)||0,v(2026,mm)||0); }
  const y=x=>H-pb-(x/max)*(H-pb-pt);
  let bars="";
  for(let mm=1;mm<=12;mm++){
    const x0=(mm-1)*slot+slot/2-bw-1, a=v(2025,mm), b=v(2026,mm);
    const sel = S.month===`2026-${String(mm).padStart(2,"0")}` || S.month===`2025-${String(mm).padStart(2,"0")}`;
    if(a!=null) bars+=`<rect x="${x0}" y="${y(a)}" width="${bw}" height="${H-pb-y(a)}" rx="2" fill="var(--line)"><title>2025-${mm} ${usd0.format(a)}</title></rect>`;
    if(b!=null) bars+=`<rect x="${x0+bw+2}" y="${y(b)}" width="${bw}" height="${H-pb-y(b)}" rx="2" fill="${LINE_COLOR[l]}"><title>2026-${mm} ${usd0.format(b)}</title></rect>`;
    if(mm%2===1||sel) bars+=`<text x="${(mm-1)*slot+slot/2}" y="${H-4}" text-anchor="middle" ${sel?'style="fill:var(--fg);font-weight:700"':""}>${mm}月</text>`;
  }
  const c=lineMonth([l],S.month), ly=lyMonth(S.month), o=ly?lineMonth([l],ly):null;
  const yy = o ? chg({v:c.sales,days:daysIn(S.month)},{v:o.sales,days:daysIn(ly)}) : null;
  return `<div class="mini"><div class="t">${lineTag(l)}<span class="muted" style="font-weight:400">峰值 ${compact.format(max)} · 所选月同比 ${chgHtml(yy)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(l)}月度销售额同比"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"></line>${bars}</svg></div>`;
}

/* ---------- 核心ASIN数据 ---------- */
function spark(a){
  const vals=DATA.months.map(m=>asinMonth(a,m).sales/daysIn(m)); const max=Math.max(...vals)||1;
  const W=110,H=26,bw=W/vals.length;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${vals.map((v,i)=>`<rect x="${i*bw+0.5}" y="${H-v/max*H}" width="${bw-1}" height="${v/max*H}" fill="${DATA.months[i]===S.month?"var(--accent)":"var(--line)"}"></rect>`).join("")}</svg>`;
}

        return `<td><div class="cell-rank ${w.rank?(ok?"hit":"miss"):""}"><b>${w.rank?"#"+w.rank:"—"}</b><small>${w.daily.toFixed(1)} 单/天 · ${pct(w.daily/t.daily,0)}</small></div></td>`; }).join("");
      const tIn=(k,v)=> ed ? `<input type="number" min="1" step="1" id="tg-${k}-${a.asin}" value="${v ?? ""}" aria-label="${k==="rank"?"目标排名":"目标日销"}">` : `<b>${k==="rank"?"#":""}${v ?? "—"}</b>`;
      return `<div class="rank-block">
        <div class="rank-head"><span class="asin">${a.asin}</span><span style="white-space:normal">${esc(a.name)}</span><span class="muted">${usd2.format(a.price)} · ${a.rating}★ ${int.format(a.ratings)}</span>
          <div class="tgt"><span>目标小类排名${tIn("rank",t.rank)}</span><span>目标日销${tIn("daily",t.daily)}</span>${t.confirmed?"":`<span class="suggest">建议值，未确认</span>`}
          ${ed?`<button class="btn" data-act="save-target" data-asin="${a.asin}">保存目标</button>`:""}
          <span>最新周完成率<b class="${rate<rule("daily_miss").value/100?"bad":"ok"}">${pct(rate,0)}</b></span></div>
          <span class="muted" style="font-size:12px">小类：${esc(a.subcategory)} · 当前 #${a.sub_rank} · 大类 BSR ${int.format(a.bsr)}${a.rank_source!==a.asin?" · 排名与 "+a.rank_source+" 共享父体":""}</span></div>
        <div class="rank-body"><div class="tbl-wrap"><table><thead><tr>${weeks.map(w=>`<th style="text-align:center">${w.week}<br><span style="font-weight:400">${w.range}</span></th>`).join("")}</tr></thead><tbody><tr>${cells}</tr></tbody></table></div></div></div>`;
    }).join("");
    const main=as[0]; const mainDaily=invOf[main.asin].daily30;
    const comps=DATA.competitors.filter(c=>c.line===l).map(c=>`<tr><td class="l mono">${c.asin}</td><td class="l">${esc(c.brand)}</td><td class="l" style="white-space:normal;min-width:200px">${esc(c.title)}</td>
      <td>${usd2.format(c.price)}</td><td class="${main.price<=c.price?"ok":"warn"}">${main.price<=c.price?"低 ":"高 "}${usd2.format(Math.abs(main.price-c.price))}</td>
      <td>${int.format(c.units)}</td><td>${(c.units/30).toFixed(0)}</td><td>#${c.sub_rank}</td><td>${int.format(c.bsr)}</td><td>${c.rating} · ${int.format(c.ratings)}</td><td>${c.nation}</td><td>${pct(mainDaily/(c.units/30),0)}</td></tr>`).join("");
    return `<div><h3 style="font-size:15px;margin:4px 0 8px">${lineTag(l)}</h3>${inner}
      <div class="card" style="margin-top:12px"><h3>${esc(l)}对标竞品</h3><p class="note">卖家精灵 ${DATA.competitor_date}，同小类近 30 天销量靠前的兼容电池类竞品（已排除我司品牌和原厂品牌）；价差和日销对比以本品线第 1 个核心 ASIN ${main.asin} 为准。</p>
      <div class="tbl-wrap"><table><thead><tr><th class="l">竞品 ASIN</th><th class="l">品牌</th><th class="l">产品</th><th>售价</th><th>我司价差</th><th>月销量</th><th>日均</th><th>小类排名</th><th>大类 BSR</th><th>评分 · 评论</th><th>卖家</th><th>我司日销 / 竞品</th></tr></thead><tbody>${comps}</tbody></table></div></div></div>`;
  }).join("");
  return `<section class="mod" id="rank">
    <div class="mod-head"><div><h2>竞对与目标排名</h2><p>每个核心 ASIN 最近 8 个完整周的小类排名（周平均，卖家精灵）和实际日均销量（日销量导出）。绿色＝排名达到目标，红色＝未达到；格内百分比为日销完成率。${ed?"目标填好后点“保存目标”。":"目标由编辑者设定；未设定时显示建议值（8 周内最好的周均排名和最高的周日销）。"}</p></div></div>
    ${blocks}
  </section>`;
}

/* ---------- 监控规则 ---------- */
function renderRules(){
  const rs=rules(), ed=S.canEdit && S.db;
  const body=rs.map(r=>`<tr class="${r.on?"":"off"}"><td class="l"><b style="font-weight:500">${esc(r.name)}</b><div class="muted" style="font-size:12px">${esc(r.scope)}</div></td>
    <td class="l">${esc(r.metric)}<div class="formula">${esc(r.formula)}</div></td>
    <td>${r.op==="<"?"低于":r.op===">"?"高于":"达到"}</td>
    <td>${ed?`<input type="number" id="th-${r.id}" step="any" value="${r.value}" aria-label="${esc(r.name)}阈值">`:`<b style="font-family:var(--font-num);font-size:17px">${r.value}</b>`} ${esc(r.unit)}</td>
    <td><span class="pill ${r.level==="high"?"high":"mid"}">${r.level==="high"?"高":"中"}</span></td>
    <td class="l">${r.on?`<span class="pill okp">已启用</span>`:`<span class="pill neutral">待导入数据</span>`}</td>
    <td class="l">${esc(r.src)}</td></tr>`).join("");
  return `<section class="mod" id="rules">
    <div class="mod-head"><div><h2>监控规则</h2><p>预警模块按下面的规则自动判定。${ed?"你有编辑权限，可以直接改阈值并保存，所有人的预警列表会一起更新。":"阈值由负责人维护，如需调整请联系工作台负责人。"}</p></div>
    ${ed?`<button class="btn primary" id="save-rules">保存阈值</button>`:""}</div>
    <div class="card"><div class="tbl-wrap"><table class="rules"><thead><tr><th class="l">规则</th><th class="l">指标与口径</th><th>条件</th><th>阈值</th><th>级别</th><th class="l">状态</th><th class="l">数据来源</th></tr></thead><tbody>${body}</tbody></table></div></div>
    <div class="card"><h3>数据口径</h3><p class="note" style="margin:0">
    范围：美国站（店铺 AMZ/HK 各美国店），三级分类为冲击扳手、黄油枪、充气泵、灯具（工作灯）、木工钉枪（钉枪）、锂电油泵（油泵）、电源逆变器（逆变器）。同一 ASIN 在多个店铺的数据合并计算。
    核心 ASIN = 各品线 ${DATA.weeks[0].start.slice(0,4)} 年 7 月 25 日至 ${END} 销售额前 3 的 ASIN。周为周一至周日。排名为卖家精灵记录的小类排名周平均，同一父体下的变体共享排名。
    环比、同比均按日均值计算。竞品数据为卖家精灵 ${DATA.competitor_date} 的近 30 天数据。</p></div>
  </section>`;
}

/* ---------- shell ---------- */
function renderControls(){
  $("#f-month").innerHTML = DATA.months.slice().reverse().map(m=>`<option value="${m}">${m.slice(0,4)} 年 ${+m.slice(5)} 月${m===END_MONTH?`（至 ${+END.slice(8)} 日）`:""}</option>`).join("");
  $("#f-month").value=S.month;
  $("#f-line").innerHTML=[["all","全部品线"],...LINES.map(l=>[l,l])].map(([k,n])=>`<button class="chip" data-line="${k}" aria-pressed="${S.line===k}">${k!=="all"?`<span class="dot" style="background:${LINE_COLOR[k]}"></span>`:""}${n}</button>`).join("");
}
function renderTabs(){
  const open=computeAlerts().filter(a=>statusOf(a.key)==="open").length;
  $("#tabs").innerHTML=TABS.map(([id,n])=>`<button role="tab" id="tab-${id}" aria-selected="${S.tab===id}" data-tab="${id}">${n}${id==="alerts"&&open?`<span class="n">${open}</span>`:""}</button>`).join("");
}
const R={overview:renderOverview, asin:renderAsin, ads:renderAds, stock:renderStock, alerts:renderAlerts, rank:renderRank, rules:renderRules};
const editing = () => document.activeElement && document.activeElement.closest && document.activeElement.closest("#alert-table, .tgt, .rules");
function render(){
  if(editing()){ S.pending=true; renderTabs(); return; }
  S.pending=false; renderTabs(); $("#view").innerHTML=R[S.tab]();
}

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-tab],[data-line],[data-af],[data-act=save],[data-act=save-target],#save-rules"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; try{localStorage.setItem("wb-tab",S.tab)}catch(_){} t.blur(); render(); window.scrollTo({top:0}); return; }
  if(t.dataset.line){ S.line=t.dataset.line; t.blur(); renderControls(); render(); return; }
  if(t.dataset.af){ S.alertFilter=t.dataset.af; t.blur(); render(); return; }
  if(t.dataset.act==="save"){ const tr=t.closest("tr"); saveAlert(tr.dataset.key,{status:tr.querySelector("[data-act=status]").value, note:tr.querySelector("[data-act=note]").value},t); return; }
  if(t.dataset.act==="save-target"){ saveTarget(t.dataset.asin,t); return; }
  if(t.id==="save-rules") saveRules(t);
});
$("#f-month").addEventListener("change", e=>{ S.month=e.target.value; e.target.blur(); render(); });
document.addEventListener("input", e=>{ if(e.target.dataset.act==="note") S.drafts[e.target.closest("tr").dataset.key]=e.target.value; });
document.addEventListener("change", e=>{ if(e.target.dataset.act==="status"){ const tr=e.target.closest("tr"); e.target.blur(); saveAlert(tr.dataset.key,{status:e.target.value, note:tr.querySelector("[data-act=note]").value}); } });
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(S.pending && !editing()) render(); },0); });

async function saveAlert(key,{status,note},btn){
  if(!S.db) return;
  const a=computeAlerts().find(x=>x.key===key); if(!a) return;
  if(btn){ btn.disabled=true; btn.textContent="保存中"; }
  try{
    await S.db.collection("alerts").doc(key).set({status, note:note.slice(0,2000), by:S.uid, at:new Date().toISOString(), asin:a.asin, line:a.line, rule:a.rid, period:a.period, value:a.value});
    delete S.drafts[key]; toast("已保存");
  }catch(err){
    if(err && err.code==="invalid_argument"){ S.canWrite=false; toast("没有填写权限，已切换为只读"); } else toast("没保存成功，请稍后再试");
  }finally{ if(btn){ btn.disabled=false; btn.textContent="保存"; btn.blur(); } render(); }
}
async function saveRules(btn){
  const th={}; for(const r of DEFAULT_RULES){ const v=parseFloat($("#th-"+r.id)?.value); if(!isFinite(v)){ toast(`「${r.name}」阈值需要是数字`); return; } th[r.id]=v; }
  btn.disabled=true;
  try{ await S.db.doc("settings/rules").set({thresholds:th, by:S.uid, at:new Date().toISOString()}); toast("阈值已保存，预警已按新阈值更新"); }
  catch(err){ toast(err&&err.code==="invalid_argument"?"只有编辑者可以修改阈值":"没保存成功，请稍后再试"); }
  finally{ btn.disabled=false; btn.blur(); render(); }
}
async function saveTarget(asin,btn){
  const r=parseInt($("#tg-rank-"+asin)?.value,10), d=parseFloat($("#tg-daily-"+asin)?.value);
  if(!(r>=1) || !(d>0)){ toast("目标排名和目标日销都需要填正数"); return; }
  const next={...S.targets,[asin]:{rank:r,daily:d}};
  btn.disabled=true;
  try{ await S.db.doc("settings/targets").set({targets:next, by:S.uid, at:new Date().toISOString()}); toast(`${asin} 目标已保存`); }
  catch(err){ toast(err&&err.code==="invalid_argument"?"只有编辑者可以设定目标":"没保存成功，请稍后再试"); }
  finally{ btn.disabled=false; btn.blur(); render(); }
}
async function resolveNames(){
  if(!S.user) return;
  const ids=[...new Set(Object.values(S.alertDocs).map(d=>d.by).filter(Boolean))].filter(id=>!(id in S.names));
  if(!ids.length) return;
  const ps=await S.user.profiles(ids);
  ids.forEach(id=>{ S.names[id]=(ps[id]&&ps[id].name)||"同事"; });
  render();
}
async function boot(){
  renderControls(); render();
  if(!window.claude || !window.claude.use){ S.dbState="none"; render(); return; }
  const [db,user]=await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  S.db=db; S.user=user; S.dbState=db?"ready":"none";
  if(user){ S.uid=await user.id(); S.canWrite=await user.can("data.write"); S.canEdit=await user.canEdit(); }
  render();
  if(!db) return;
  db.collection("alerts").onSnapshot(snap=>{ S.alertDocs=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); render(); resolveNames(); }, ()=>{ S.dbState="none"; S.db=null; render(); });
  db.doc("settings/rules").onSnapshot(snap=>{ S.thresholds=(snap.exists&&snap.data().thresholds)||{}; render(); }, ()=>{});
  db.doc("settings/targets").onSnapshot(snap=>{ S.targets=(snap.exists&&snap.data().targets)||{}; render(); }, ()=>{});
}
boot();
</script>
