  {id:"acos_high", name:"ACOS 过高", metric:"ACOS", op:">", value:35, unit:"%", level:"mid", scope:"月度 · ASIN", formula:"广告花费 ÷ 广告销售额", src:"领星产品表现（2026-09 起，7 个品线）", on:true},

];
const END = DATA.data_end, END_MONTH = END.slice(0,7);
const LAST_FULL = DATA.months[DATA.months.length-2];

/* ---------- state ---------- */
const S = {month: LAST_FULL, line:"all", tab:"overview", alertFilter:"all",
  thresholds:{}, targets:{}, alertDocs:{}, drafts:{}, db:null, user:null, canWrite:null, canEdit:false, uid:null, names:{}, dbState:"loading"};
try{ const t = localStorage.getItem("wb-tab"); if(t && TABS.some(x=>x[0]===t)) S.tab=t; }catch(e){}
const h0 = location.hash.slice(1); if(TABS.some(x=>x[0]===h0)) S.tab=h0;

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const usd0 = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const usd2 = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});
const int = new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
const compact = new Intl.NumberFormat("en-US",{notation:"compact",maximumFractionDigits:1});
const pct = (x,d=1)=> (x==null||!isFinite(x)) ? "—" : (x*100).toFixed(d)+"%";
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const asinInfo = Object.fromEntries(DATA.asins.map(a=>[a.asin,a]));
const invOf = Object.fromEntries(DATA.inventory.map(i=>[i.asin,i]));
const lineInv = Object.fromEntries(DATA.line_inventory.map(i=>[i.line,i]));
const inLine = a => S.line==="all" || asinInfo[a].line===S.line;
const linesShown = () => S.line==="all" ? LINES : [S.line];
const monthLabel = m => m===END_MONTH ? `${+m.slice(5)} 月（1–${+END.slice(8)} 日）` : `${m.slice(2,4)} 年 ${+m.slice(5)} 月`;
const daysIn = m => m===END_MONTH ? +END.slice(8) : new Date(Date.UTC(+m.slice(0,4), +m.slice(5), 0)).getUTCDate();
const prevMonth = m => { const i=DATA.months.indexOf(m); return i>0?DATA.months[i-1]:null; };
const lyMonth = m => { const x=(+m.slice(0,4)-1)+m.slice(4); return DATA.months.includes(x)?x:null; };
const rules = () => DEFAULT_RULES.map(r=>({...r, value: S.thresholds[r.id] ?? r.value}));
const rule = id => rules().find(r=>r.id===id);
const lineTag = l => `<span class="lt"><i style="background:${LINE_COLOR[l]}"></i>${esc(l)}</span>`;
const PEND = `<span class="pend">待导入</span>`;
function chg(cur, prev){ // daily-average change, cur/prev are {v, days}
  if(!prev || !prev.v) return null; return (cur.v/cur.days)/(prev.v/prev.days)-1;
}
function chgHtml(d, label){
  if(d==null||!isFinite(d)) return `<span class="flat">${label?"无"+label:"—"}</span>`;
  const cls = Math.abs(d)<0.0005?"flat":(d>0?"up":"down");
  return `<span class="${cls}">${d>=0?"+":""}${(d*100).toFixed(1)}%</span>${label?` <span class="flat">${label}</span>`:""}`;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }

/* ---------- aggregation ---------- */
const lmIdx = {}; DATA.line_monthly.forEach(r=>{ lmIdx[r.line+"|"+r.month]=r; });
const amIdx = {}; DATA.monthly.forEach(r=>{ amIdx[r.asin+"|"+r.month]=r; });
const wkIdx = {}; DATA.weekly.forEach(r=>{ wkIdx[r.asin+"|"+r.week]=r; });
function lineMonth(lines, m){
  const o={sales:0,units:0,orders:0,active:0};
  lines.forEach(l=>{ const r=lmIdx[l+"|"+m]; if(r){ o.sales+=r.sales; o.units+=r.units; o.orders+=r.orders; o.active+=r.active_asins; } });
  return o;
}
const asinMonth = (a,m) => amIdx[a+"|"+m] || {units:0,orders:0,sales:0,avail_end:0,fba_end:0};
function invDays(i){ return i.daily30>0 ? i.avail/i.daily30 : null; }
function weeksOf(a){ return DATA.weeks.map(w=>wkIdx[a+"|"+w.week]); }
function target(a){
  const t=S.targets[a]; const ws=weeksOf(a);
  const sugDaily = Math.max(1, Math.round(Math.max(...ws.map(w=>w.daily))));
  const ranks = ws.map(w=>w.rank).filter(x=>x);
  const sugRank = ranks.length ? Math.min(...ranks) : null;
  return {rank: t?.rank ?? sugRank, daily: t?.daily ?? sugDaily, confirmed: !!(t && t.rank!=null && t.daily!=null)};
}

/* ---------- 领星产品表现 ---------- */
const LX = DATA.lx, LX_LINES = new Set(LX.lines);
const lxA = {}; LX.asin_month.forEach(r=>{ lxA[r.asin+"|"+r.month]=r; });
const lxL = {}; LX.line_month.forEach(r=>{ lxL[r.line+"|"+r.month]=r; });
const lxInv = Object.fromEntries(LX.inv.map(i=>[i.asin,i]));
const lxMonth = m => LX.months.includes(m) ? m : LX.months[LX.months.length-1];
const hasLx = (l,m) => LX_LINES.has(l) && LX.months.includes(m);
function lxSum(lines,m){ const o={}; lines.filter(l=>LX_LINES.has(l)).forEach(l=>{ const r=lxL[l+"|"+m]; if(r) for(const k in r) if(typeof r[k]==="number") o[k]=(o[k]||0)+r[k]; }); return o; }
const lxNoMonth = l => LX_LINES.has(l) ? `<span class="pend">9 月起</span>` : PEND;
const lxEndLabel = () => `${+LX.end.slice(5,7)}-${+LX.end.slice(8)}`;

/* ---------- alerts ---------- */
function test(r, v){ return r.op==="<" ? v < r.value : r.op===">" ? v > r.value : r.op===">=" ? v >= r.value : false; }
function fmtVal(r, v){ return r.unit==="%" ? v.toFixed(1)+"%" : r.unit==="天" ? Math.round(v)+" 天" : v+" "+r.unit; }
function computeAlerts(){
  const out=[]; const m=S.month;
  const add=(rid, asin, v, period, extra="")=>{
    const r=rule(rid); if(!r.on || v==null || !isFinite(v) || !test(r,v)) return;
    out.push({key:`${period.replace(/-/g,"")}_${asin}_${rid}`, rid, asin, line:asinInfo[asin].line,
      rule:r, value:fmtVal(r,v), threshold:`${r.op===">="?"≥":r.op} ${r.value}${r.unit==="%"?"%":" "+r.unit}`, period, extra});
  };
  const lastW = DATA.weeks[DATA.weeks.length-1].week;
  DATA.asins.filter(a=>inLine(a.asin)).forEach(({asin})=>{
    const i=invOf[asin]; const d=invDays(i); const p="INV"+i.date;
    add("stock_low",asin,d,p,`可用 ${int.format(i.avail)} 件 · 日均 ${i.daily30.toFixed(1)}`);
    add("stock_high",asin,d,p,`可用 ${int.format(i.avail)} 件 · 日均 ${i.daily30.toFixed(1)}`);
    const ws=weeksOf(asin); const prev=ws.slice(0,4).reduce((t,w)=>t+w.units,0), last=ws.slice(4).reduce((t,w)=>t+w.units,0);
    if(prev>=28) add("sales_drop",asin,(prev-last)/prev*100,lastW,`前 4 周日均 ${(prev/28).toFixed(1)} → 近 4 周 ${(last/28).toFixed(1)}`);
    const ly=lyMonth(m); if(ly){ const c=asinMonth(asin,m), o=asinMonth(asin,ly);
      if(o.sales>=1000) add("yoy_drop",asin,(1-(c.sales/daysIn(m))/(o.sales/daysIn(ly)))*100,m,`去年同月日均 ${usd0.format(o.sales/daysIn(ly))} → ${usd0.format(c.sales/daysIn(m))}`); }
    const t=target(asin), lw=ws[ws.length-1];
    if(t.confirmed) add("daily_miss",asin,Math.round(lw.daily/t.daily*1000)/10,lastW,`${lw.daily.toFixed(1)} 单/天 · 目标 ${t.daily}`);
    if(t.confirmed && t.rank){ let streak=0; for(let k=ws.length-1;k>=0 && ws[k].rank && ws[k].rank>t.rank;k--) streak++;
      add("rank_miss",asin,streak,lastW,`最新周均 #${lw.rank} · 目标 #${t.rank}`); }
    const lm=lxMonth(m), r=lxA[asin+"|"+lm];
    if(r && r.sales>=1000){
      add("margin_low",asin,r.profit/r.sales*100,lm,`订单毛利 ${usd0.format(r.profit)} / 销售额 ${usd0.format(r.sales)}`);
      add("tacos_high",asin,r.ad/r.sales*100,lm,`广告 ${usd0.format(r.ad)} / 销售额 ${usd0.format(r.sales)}`);
      if(r.ad_sales>0) add("acos_high",asin,r.ad/r.ad_sales*100,lm,`广告 ${usd0.format(r.ad)} / 广告销售额 ${usd0.format(r.ad_sales)}`);
      add("refund_high",asin,r.refund_amt/r.sales*100,lm,`退款 ${int.format(r.refund_qty)} 件 · ${usd0.format(r.refund_amt)}`);
    }
  });
  const order={high:0,mid:1};
  return out.sort((a,b)=>order[a.rule.level]-order[b.rule.level] || LINES.indexOf(a.line)-LINES.indexOf(b.line));
}
const statusOf = k => S.alertDocs[k]?.status || "open";
const STATUS = {open:["未处理"],doing:["处理中"],done:["已处理"]};

/* ---------- 整体看板 ---------- */
function renderOverview(){
  const m=S.month, pm=prevMonth(m), ly=lyMonth(m), ls=linesShown();
  const cur=lineMonth(ls,m), prev=pm?lineMonth(ls,pm):null, last=ly?lineMonth(ls,ly):null;
  const D=daysIn(m);
  const avail = ls.reduce((t,l)=>t+lineInv[l].avail,0), d30 = ls.reduce((t,l)=>t+lineInv[l].daily30,0);
  const alerts=computeAlerts();
  const cc=(k)=>({mom: prev?chg({v:cur[k],days:D},{v:prev[k],days:daysIn(pm)}):null, yoy: last?chg({v:cur[k],days:D},{v:last[k],days:daysIn(ly)}):null});
  const kp=(k,v,c,sub)=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${sub ?? `环比 ${chgHtml(c.mom)}　同比 ${chgHtml(c.yoy)}`}</div></div>`;
  const tiles=[
    kp("销售额",usd0.format(cur.sales),cc("sales")),
    kp("销量（件）",int.format(cur.units),cc("units")),
    kp("订单量",int.format(cur.orders),cc("orders")),
    kp("件均售价",usd2.format(cur.sales/cur.units),null,`<span class="flat">日均销售额 ${usd0.format(cur.sales/D)}</span>`),
    (()=>{ const X=lxSum(ls,m); const n=ls.filter(l=>LX_LINES.has(l)).length;
      return X.sales ? kp("订单毛利 · 毛利率",`${compact.format(X.profit)} · ${pct(X.profit/X.sales)}`,null,`<span class="flat">TACOS ${pct(X.ad/X.sales)} · 领星 ${n} 个品线${m===LX.end.slice(0,7)?" · 至 "+lxEndLabel():""}</span>`)
        : kp("订单毛利 · 毛利率","—",null,`<span class="flat">${n?"领星数据从 2026 年 9 月起":"所选品线未提供领星报表"}</span>`); })(),
    kp("可用库存（件）",int.format(avail),null,`<span class="flat">可售 ${Math.round(avail/d30)} 天 · 截至 ${END}</span>`)
  ].join("");
  const rows = ls.map(l=>{
    const c=lineMonth([l],m), p=pm?lineMonth([l],pm):null, y=ly?lineMonth([l],ly):null;
    const core = DATA.asins.filter(a=>a.line===l).reduce((t,a)=>t+asinMonth(a.asin,m).sales,0);
    const li=lineInv[l]; const al=alerts.filter(a=>a.line===l); const ao=al.filter(a=>statusOf(a.key)!=="done").length;
    return `<tr><td class="l">${lineTag(l)}</td><td>${usd0.format(c.sales)}</td>
      <td>${chgHtml(p?chg({v:c.sales,days:D},{v:p.sales,days:daysIn(pm)}):null)}</td>
      <td>${chgHtml(y?chg({v:c.sales,days:D},{v:y.sales,days:daysIn(ly)}):null)}</td>
      <td>${int.format(c.units)}</td><td>${int.format(c.orders)}</td><td>${c.units?usd2.format(c.sales/c.units):"—"}</td>
      <td>${c.active}</td><td>${pct(core/c.sales)}</td>
      ${(()=>{ const X=hasLx(l,m)?lxL[l+"|"+m]:null; if(!X) return `<td>${lxNoMonth(l)}</td><td>${lxNoMonth(l)}</td><td>${lxNoMonth(l)}</td>`;
        return `<td class="${X.profit/X.sales*100<rule("margin_low").value?"bad":""}">${pct(X.profit/X.sales)}</td><td class="${X.ad/X.sales*100>rule("tacos_high").value?"bad":""}">${pct(X.ad/X.sales)}</td><td class="${X.refund_amt/X.sales*100>rule("refund_high").value?"bad":""}">${pct(X.refund_amt/X.sales)}</td>`; })()}
      <td>${int.format(li.avail)}</td>
      <td class="${li.avail/li.daily30<rule("stock_low").value?"bad":li.avail/li.daily30>rule("stock_high").value?"warn":""}">${li.daily30?Math.round(li.avail/li.daily30):"—"}</td>
      <td>${al.length?`<span class="pill ${ao?"high":"okp"}">${ao} 未完成 / ${al.length}</span>`:`<span class="pill okp">无</span>`}</td></tr>`;
  }).join("");
  const minis = ls.map(l=>yoyChart(l)).join("");
  return `<section class="mod" id="overview">
    <div class="mod-head"><div><h2>整体看板</h2><p>${monthLabel(m)}，${S.line==="all"?"七个重点品线":S.line}的美国站经营数据。${m===END_MONTH?"本月未结束，环比和同比按日均计算。":"环比、同比按日均计算，消除天数差异。"}</p></div></div>
    <div class="kpis">${tiles}</div>
    <div class="card"><h3>分品线经营数据</h3><p class="note">${monthLabel(m)}；“核心 ASIN 占比”为该品线 3 个核心 ASIN 的销售额占比；库存和可售天数为 ${END} 快照；毛利率、TACOS、退款率来自领星产品表现（2026 年 9 月起），红字为超出监控阈值。</p>
      <div class="tbl-wrap"><table><thead><tr><th class="l">品线</th><th>销售额</th><th>环比</th><th>同比</th><th>销量</th><th>订单</th><th>件均价</th><th>在售 ASIN</th><th>核心 ASIN 占比</th><th>订单毛利率</th><th>TACOS</th><th>退款率</th><th>可用库存</th><th>可售天数</th><th>预警</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><h3>月度销售额：2026 vs 2025</h3><p class="note">柱为销售额（每个品线单独纵轴）；折线为 2026 年各月同比、环比，按日均销售额计算，右侧为百分比刻度，超出刻度的点画成空心圆，悬停可看具体数值；${+END.slice(5,7)} 月为 1–${+END.slice(8)} 日数据。</p>
      <div class="yoy-legend"><span><i style="background:var(--line)"></i>2025 年销售额</span><span><i style="background:var(--s1);opacity:.55"></i>2026 年销售额（按品线颜色）</span><span><i style="background:var(--fg);height:2px;vertical-align:3px"></i>同比</span><span><i style="background:var(--accent);height:2px;vertical-align:3px"></i>环比（虚线）</span></div>
      <div class="minis">${minis}</div></div>
  </section>`;
}
function yoyChart(l){
  const W=320,H=150,pl=4,pr=42,pb=16,pt=10,slot=(W-pl-pr)/12,bw=Math.min(8,slot/2-2), base=H-pb;
  const key=(y,mm)=>`${y}-${String(mm).padStart(2,"0")}`;
  const v=(y,mm)=>{ const r=lmIdx[l+"|"+key(y,mm)]; return r?r.sales:null; };
  const dv=(y,mm)=>{ const x=v(y,mm); return x==null?null:x/daysIn(key(y,mm)); };
  let max=0; for(let mm=1;mm<=12;mm++){ max=Math.max(max,v(2025,mm)||0,v(2026,mm)||0); }
  const y=x=>base-(x/max)*(base-pt);
  const cx=mm=>pl+(mm-1)*slot+slot/2;
  // 同比 / 环比（按日均销售额）
  const yoy=[], mom=[];
  for(let mm=1;mm<=12;mm++){
    const c=dv(2026,mm); if(c==null) continue;
    const a=dv(2025,mm); if(a) yoy.push([mm,c/a-1]);
    const p= mm===1 ? dv(2025,12) : dv(2026,mm-1); if(p) mom.push([mm,c/p-1]);
  }
  const ext=Math.max(...[...yoy,...mom].map(d=>Math.abs(d[1])),0.2);
  const lim=Math.min(1,Math.ceil(ext*10)/10);
  const yp=r=>{ const c=Math.max(-lim,Math.min(lim,r)); return pt+(1-(c+lim)/(2*lim))*(base-pt); };
  let bars="";
  for(let mm=1;mm<=12;mm++){
    const x0=cx(mm)-bw-1, a=v(2025,mm), b=v(2026,mm);
    if(a!=null) bars+=`<rect x="${x0}" y="${y(a)}" width="${bw}" height="${base-y(a)}" rx="2" fill="var(--line)" opacity=".8"><title>2025-${mm} ${usd0.format(a)}</title></rect>`;
    if(b!=null) bars+=`<rect x="${x0+bw+2}" y="${y(b)}" width="${bw}" height="${base-y(b)}" rx="2" fill="${LINE_COLOR[l]}" opacity=".55"><title>2026-${mm} ${usd0.format(b)}</title></rect>`;
    const sel=S.month===key(2026,mm)||S.month===key(2025,mm);
    const selM=+S.month.slice(5), near=Math.abs(mm-selM)===1;
    if(sel||(mm%2===1&&!near)) bars+=`<text x="${cx(mm)}" y="${H-3}" text-anchor="middle" ${sel?'style="fill:var(--fg);font-weight:700"':""}>${mm}月</text>`;
  }
  const fmt=r=>`${r>=0?"+":""}${(r*100).toFixed(0)}%`;
  const path=(pts,stroke,dash,name)=> pts.length ? `<polyline points="${pts.map(([mm,r])=>`${cx(mm)+(name==="同比"?3:-3)},${yp(r)}`).join(" ")}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="3 2"':""}></polyline>`
    + pts.map(([mm,r])=>{ const clip=Math.abs(r)>lim; return `<circle cx="${cx(mm)+(name==="同比"?3:-3)}" cy="${yp(r)}" r="${clip?3:2.2}" fill="${clip?"var(--panel)":stroke}" stroke="${stroke}" stroke-width="1.2"><title>2026 年 ${mm} 月${name} ${fmt(r)}（按日均）</title></circle>`; }).join("") : "";
  const axis=`<line x1="${pl}" x2="${W-pr}" y1="${yp(0)}" y2="${yp(0)}" stroke="var(--muted)" stroke-dasharray="2 3" stroke-width=".8"></line>
    <text x="${W-pr+4}" y="${yp(lim)+4}">+${lim*100}%</text><text x="${W-pr+4}" y="${yp(0)+4}">0%</text><text x="${W-pr+4}" y="${yp(-lim)+4}">−${lim*100}%</text>`;

/* ---------- 核心ASIN数据 ---------- */
function spark(a){
  const vals=DATA.months.map(m=>asinMonth(a,m).sales/daysIn(m)); const max=Math.max(...vals)||1;
  const W=110,H=26,bw=W/vals.length;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${vals.map((v,i)=>`<rect x="${i*bw+0.5}" y="${H-v/max*H}" width="${bw-1}" height="${v/max*H}" fill="${DATA.months[i]===S.month?"var(--accent)":"var(--line)"}"></rect>`).join("")}</svg>`;
}
function renderAsin(){
  const m=S.month, pm=prevMonth(m), ly=lyMonth(m), D=daysIn(m);

    const cell=(r,fn)=> r ? fn(r) : (on ? "—" : lxNoMonth(l));

function ratioCells(r,cell){

function asinRow(a,c,p,y,r,cell,D,pm,ly){

  const off=rules().filter(r=>!r.on).map(r=>r.name).join("、");
  return `<section class="mod" id="alerts">
    <div class="mod-head"><div><h2>预警处理</h2><p>按“监控规则”自动筛出的核心 ASIN。库存类按 ${END} 快照，销量下滑和目标类按最新完整周 ${DATA.weeks[DATA.weeks.length-1].week}（${DATA.weeks[DATA.weeks.length-1].range}），同比按所选月份 ${monthLabel(S.month)}，毛利率、TACOS、ACOS、退款率按领星 ${monthLabel(lxMonth(S.month))}${LX.months.includes(S.month)?"":"（所选月份无领星数据）"}。运营填写处理说明后点保存，所有人看到同一份记录。</p></div></div>
    ${notice}
    <div class="card">
      <div class="toolbar" style="margin-bottom:12px"><div class="counts">${fbtn("all","全部",all.length)}${fbtn("open","未处理",cnt("open"))}${fbtn("doing","处理中",cnt("doing"))}${fbtn("done","已处理",cnt("done"))}</div>
      <span class="foot">处理状态改动会立即保存；处理说明写完点“保存”。</span></div>
      <div class="tbl-wrap"><table id="alert-table"><thead><tr><th class="l">级别</th><th class="l">品线</th><th class="l">ASIN</th><th class="l">触发规则</th><th>当前值</th><th>阈值</th><th class="l">处理状态</th><th class="l">处理说明</th><th class="l"></th><th class="l">最后更新</th></tr></thead>
      <tbody>${rows||`<tr><td class="l muted" colspan="10">当前筛选下没有预警。</td></tr>`}</tbody></table></div>
      <p class="foot">暂未启用（缺数据）：${off}。日销和排名两条规则只对已确认目标的 ASIN 生效，目标在“竞对与目标排名”里由编辑者填写并保存。</p>
    </div>
  </section>`;
}

/* ---------- 竞对与目标排名 ---------- */
function renderRank(){
  const weeks=DATA.weeks, ed=S.canEdit && S.db;
  const blocks=linesShown().map(l=>{
    const as=DATA.asins.filter(a=>a.line===l);
    const inner=as.map(a=>{
      const ws=weeksOf(a.asin), t=target(a.asin), lw=ws[ws.length-1], rate=lw.daily/t.daily;
      const cells=ws.map(w=>{ const ok=w.rank && t.rank && w.rank<=t.rank;
        return `<td><div class="cell-rank ${w.rank?(ok?"hit":"miss"):""}"><b>${w.rank?"#"+w.rank:"—"}</b><small>${w.daily.toFixed(1)} 单/天 · ${pct(w.daily/t.daily,0)}</small></div></td>`; }).join("");
      const tIn=(k,v)=> ed ? `<input type="number" min="1" step="1" id="tg-${k}-${a.asin}" value="${v ?? ""}" aria-label="${k==="rank"?"目标排名":"目标日销"}">` : `<b>${k==="rank"?"#":""}${v ?? "—"}</b>`;
      return `<div class="rank-block">
        <div class="rank-head"><span class="asin">${a.asin}</span><span style="white-space:normal">${esc(a.name)}</span><span class="muted">${usd2.format(a.price)} · ${a.rating}★ ${int.format(a.ratings)}</span>
          <div class="tgt"><span>目标小类排名${tIn("rank",t.rank)}</span><span>目标日销${tIn("daily",t.daily)}</span>${t.confirmed?"":`<span class="suggest">建议值，未确认</span>`}
          ${ed?`<button class="btn" data-act="save-target" data-asin="${a.asin}">保存目标</button>`:""}
          <span>最新周完成率<b class="${rate<rule("daily_miss").value/100?"bad":"ok"}">${pct(rate,0)}</b></span></div>
          <span class="muted" style="font-size:12px">小类：${esc(a.subcategory)} · 当前 #${a.sub_rank} · 大类 BSR ${int.format(a.bsr)}${a.rank_source!==a.asin?" · 排名与 "+a.rank_source+" 共享父体":""}</span></div>
        <div class="rank-body"><div class="tbl-wrap"><table><thead><tr>${weeks.map(w=>`<th style="text-align:center">${w.week}<br><span style="font-weight:400">${w.range}</span></th>`).join("")}</tr></thead><tbody><tr>${cells}</tr></tbody></table></div></div></div>`;
    }).join("");
    const main=as[0]; const mainDaily=invOf[main.asin].daily30;
    const comps=DATA.competitors.filter(c=>c.line===l).map(c=>`<tr><td class="l mono">${c.asin}</td><td class="l">${esc(c.brand)}</td><td class="l" style="white-space:normal;min-width:200px">${esc(c.title)}</td>
      <td>${usd2.format(c.price)}</td><td class="${main.price<=c.price?"ok":"warn"}">${main.price<=c.price?"低 ":"高 "}${usd2.format(Math.abs(main.price-c.price))}</td>
      <td>${int.format(c.units)}</td><td>${(c.units/30).toFixed(0)}</td><td>#${c.sub_rank}</td><td>${int.format(c.bsr)}</td><td>${c.rating} · ${int.format(c.ratings)}</td><td>${c.nation}</td><td>${pct(mainDaily/(c.units/30),0)}</td></tr>`).join("");
    return `<div><h3 style="font-size:15px;margin:4px 0 8px">${lineTag(l)}</h3>${inner}
      <div class="card" style="margin-top:12px"><h3>${esc(l)}对标竞品</h3><p class="note">卖家精灵 ${DATA.competitor_date}，同小类近 30 天销量靠前的兼容电池类竞品（已排除我司品牌和原厂品牌）；价差和日销对比以本品线第 1 个核心 ASIN ${main.asin} 为准。</p>
      <div class="tbl-wrap"><table><thead><tr><th class="l">竞品 ASIN</th><th class="l">品牌</th><th class="l">产品</th><th>售价</th><th>我司价差</th><th>月销量</th><th>日均</th><th>小类排名</th><th>大类 BSR</th><th>评分 · 评论</th><th>卖家</th><th>我司日销 / 竞品</th></tr></thead><tbody>${comps}</tbody></table></div></div></div>`;
  }).join("");
  return `<section class="mod" id="rank">
    <div class="mod-head"><div><h2>竞对与目标排名</h2><p>每个核心 ASIN 最近 8 个完整周的小类排名（周平均，卖家精灵）和实际日均销量（日销量导出）。绿色＝排名达到目标，红色＝未达到；格内百分比为日销完成率。${ed?"目标填好后点“保存目标”。":"目标由编辑者设定；未设定时显示建议值（8 周内最好的周均排名和最高的周日销）。"}</p></div></div>
    ${blocks}
  </section>`;
}

/* ---------- 监控规则 ---------- */
function renderRules(){
  const rs=rules(), ed=S.canEdit && S.db;
  const body=rs.map(r=>`<tr class="${r.on?"":"off"}"><td class="l"><b style="font-weight:500">${esc(r.name)}</b><div class="muted" style="font-size:12px">${esc(r.scope)}</div></td>
    <td class="l">${esc(r.metric)}<div class="formula">${esc(r.formula)}</div></td>
    <td>${r.op==="<"?"低于":r.op===">"?"高于":"达到"}</td>
    <td>${ed?`<input type="number" id="th-${r.id}" step="any" value="${r.value}" aria-label="${esc(r.name)}阈值">`:`<b style="font-family:var(--font-num);font-size:17px">${r.value}</b>`} ${esc(r.unit)}</td>
    <td><span class="pill ${r.level==="high"?"high":"mid"}">${r.level==="high"?"高":"中"}</span></td>
    <td class="l">${r.on?`<span class="pill okp">已启用</span>`:`<span class="pill neutral">待导入数据</span>`}</td>
    <td class="l">${esc(r.src)}</td></tr>`).join("");
  return `<section class="mod" id="rules">
    <div class="mod-head"><div><h2>监控规则</h2><p>预警模块按下面的规则自动判定。${ed?"你有编辑权限，可以直接改阈值并保存，所有人的预警列表会一起更新。":"阈值由负责人维护，如需调整请联系工作台负责人。"}</p></div>
    ${ed?`<button class="btn primary" id="save-rules">保存阈值</button>`:""}</div>
    <div class="card"><div class="tbl-wrap"><table class="rules"><thead><tr><th class="l">规则</th><th class="l">指标与口径</th><th>条件</th><th>阈值</th><th>级别</th><th class="l">状态</th><th class="l">数据来源</th></tr></thead><tbody>${body}</tbody></table></div></div>
    <div class="card"><h3>数据口径</h3><p class="note" style="margin:0">
    范围：美国站（店铺 AMZ/HK 各美国店），三级分类为冲击扳手、黄油枪、充气泵、灯具（工作灯）、木工钉枪（钉枪）、锂电油泵（油泵）、电源逆变器（逆变器）。同一 ASIN 在多个店铺的数据合并计算。
    核心 ASIN = 各品线 ${DATA.weeks[0].start.slice(0,4)} 年 7 月 25 日至 ${END} 销售额前 3 的 ASIN。周为周一至周日。排名为卖家精灵记录的小类排名周平均，同一父体下的变体共享排名。
    毛利、广告、退款、流量和在途库存来自领星“产品表现-ASIN”日报（2026-09-01 至 ${LX.end}，七个品线）；毛利采用订单毛利润，结算毛利润因回款滞后仅作参考。环比、同比均按日均值计算。竞品数据为卖家精灵 ${DATA.competitor_date} 的近 30 天数据。</p></div>
  </section>`;
}

/* ---------- shell ---------- */
function renderControls(){
  $("#f-month").innerHTML = DATA.months.slice().reverse().map(m=>`<option value="${m}">${m.slice(0,4)} 年 ${+m.slice(5)} 月${m===END_MONTH?`（至 ${+END.slice(8)} 日）`:""}</option>`).join("");
  $("#f-month").value=S.month;
  $("#f-line").innerHTML=[["all","全部品线"],...LINES.map(l=>[l,l])].map(([k,n])=>`<button class="chip" data-line="${k}" aria-pressed="${S.line===k}">${k!=="all"?`<span class="dot" style="background:${LINE_COLOR[k]}"></span>`:""}${n}</button>`).join("");
}
function renderTabs(){
  const open=computeAlerts().filter(a=>statusOf(a.key)==="open").length;
  $("#tabs").innerHTML=TABS.map(([id,n])=>`<button role="tab" id="tab-${id}" aria-selected="${S.tab===id}" data-tab="${id}">${n}${id==="alerts"&&open?`<span class="n">${open}</span>`:""}</button>`).join("");
}
const R={overview:renderOverview, asin:renderAsin, ads:renderAds, stock:renderStock, alerts:renderAlerts, rank:renderRank, rules:renderRules};
const editing = () => document.activeElement && document.activeElement.closest && document.activeElement.closest("#alert-table, .tgt, .rules");
function render(){
  if(editing()){ S.pending=true; renderTabs(); return; }
  S.pending=false; renderTabs(); $("#view").innerHTML=R[S.tab]();
}

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-tab],[data-line],[data-af],[data-act=save],[data-act=save-target],#save-rules"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; try{localStorage.setItem("wb-tab",S.tab)}catch(_){} t.blur(); render(); window.scrollTo({top:0}); return; }
  if(t.dataset.line){ S.line=t.dataset.line; t.blur(); renderControls(); render(); return; }
  if(t.dataset.af){ S.alertFilter=t.dataset.af; t.blur(); render(); return; }
  if(t.dataset.act==="save"){ const tr=t.closest("tr"); saveAlert(tr.dataset.key,{status:tr.querySelector("[data-act=status]").value, note:tr.querySelector("[data-act=note]").value},t); return; }
  if(t.dataset.act==="save-target"){ saveTarget(t.dataset.asin,t); return; }
  if(t.id==="save-rules") saveRules(t);
});
$("#f-month").addEventListener("change", e=>{ S.month=e.target.value; e.target.blur(); render(); });
document.addEventListener("input", e=>{ if(e.target.dataset.act==="note") S.drafts[e.target.closest("tr").dataset.key]=e.target.value; });
document.addEventListener("change", e=>{ if(e.target.dataset.act==="status"){ const tr=e.target.closest("tr"); e.target.blur(); saveAlert(tr.dataset.key,{status:e.target.value, note:tr.querySelector("[data-act=note]").value}); } });
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(S.pending && !editing()) render(); },0); });

async function saveAlert(key,{status,note},btn){
  if(!S.db) return;
  const a=computeAlerts().find(x=>x.key===key); if(!a) return;
  if(btn){ btn.disabled=true; btn.textContent="保存中"; }
  try{
    await S.db.collection("alerts").doc(key).set({status, note:note.slice(0,2000), by:S.uid, at:new Date().toISOString(), asin:a.asin, line:a.line, rule:a.rid, period:a.period, value:a.value});
    delete S.drafts[key]; toast("已保存");
  }catch(err){
    if(err && err.code==="invalid_argument"){ S.canWrite=false; toast("没有填写权限，已切换为只读"); } else toast("没保存成功，请稍后再试");
  }finally{ if(btn){ btn.disabled=false; btn.textContent="保存"; btn.blur(); } render(); }
}
async function saveRules(btn){
  const th={}; for(const r of DEFAULT_RULES){ const v=parseFloat($("#th-"+r.id)?.value); if(!isFinite(v)){ toast(`「${r.name}」阈值需要是数字`); return; } th[r.id]=v; }
  btn.disabled=true;
  try{ await S.db.doc("settings/rules").set({thresholds:th, by:S.uid, at:new Date().toISOString()}); toast("阈值已保存，预警已按新阈值更新"); }
  catch(err){ toast(err&&err.code==="invalid_argument"?"只有编辑者可以修改阈值":"没保存成功，请稍后再试"); }
  finally{ btn.disabled=false; btn.blur(); render(); }
}
async function saveTarget(asin,btn){
  const r=parseInt($("#tg-rank-"+asin)?.value,10), d=parseFloat($("#tg-daily-"+asin)?.value);
  if(!(r>=1) || !(d>0)){ toast("目标排名和目标日销都需要填正数"); return; }
  const next={...S.targets,[asin]:{rank:r,daily:d}};
  btn.disabled=true;
  try{ await S.db.doc("settings/targets").set({targets:next, by:S.uid, at:new Date().toISOString()}); toast(`${asin} 目标已保存`); }
  catch(err){ toast(err&&err.code==="invalid_argument"?"只有编辑者可以设定目标":"没保存成功，请稍后再试"); }
  finally{ btn.disabled=false; btn.blur(); render(); }
}
async function resolveNames(){
  if(!S.user) return;
  const ids=[...new Set(Object.values(S.alertDocs).map(d=>d.by).filter(Boolean))].filter(id=>!(id in S.names));
  if(!ids.length) return;
  const ps=await S.user.profiles(ids);
  ids.forEach(id=>{ S.names[id]=(ps[id]&&ps[id].name)||"同事"; });
  render();
}
async function boot(){
  renderControls(); render();
  if(!window.claude || !window.claude.use){ S.dbState="none"; render(); return; }
  const [db,user]=await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  S.db=db; S.user=user; S.dbState=db?"ready":"none";
  if(user){ S.uid=await user.id(); S.canWrite=await user.can("data.write"); S.canEdit=await user.canEdit(); }
  render();
  if(!db) return;
  db.collection("alerts").onSnapshot(snap=>{ S.alertDocs=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); render(); resolveNames(); }, ()=>{ S.dbState="none"; S.db=null; render(); });
  db.doc("settings/rules").onSnapshot(snap=>{ S.thresholds=(snap.exists&&snap.data().thresholds)||{}; render(); }, ()=>{});
  db.doc("settings/targets").onSnapshot(snap=>{ S.targets=(snap.exists&&snap.data().targets)||{}; render(); }, ()=>{});
}
boot();
</script>
