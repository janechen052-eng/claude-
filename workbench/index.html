const delta = (cur,prev,goodUp=true,isRate=false)=>{
  if(prev==null||!isFinite(prev)||prev===0) return `<span class="flat">无上月对比</span>`;
  const d = isRate ? (cur-prev) : (cur-prev)/Math.abs(prev);

  const txt = isRate ? `${d>=0?"+":""}${(d*100).toFixed(1)} 个百分点` : `${d>=0?"+":""}${(d*100).toFixed(1)}%`;
  return `<span class="${cls}">${txt}</span> <span class="flat">较上月</span>`;
};

/* ---------- aggregation ---------- */
const SUM_KEYS = ["units","sales","refund","returns","cogs","freight","fba","commission","ad","storage","aged_fee","promo","profit"];
function rowsFor(month, filterFn=()=>true){
  return DATA.monthly.filter(r => (month==="all" || r.month===month) && inLine(r.asin) && filterFn(r));
}
function sumRows(rows){
  const o = Object.fromEntries(SUM_KEYS.map(k=>[k,0]));
  rows.forEach(r=>SUM_KEYS.forEach(k=>o[k]+=r[k]));
  return o;
}
function byAsin(month){
  const m = {};
  rowsFor(month).forEach(r=>{ (m[r.asin] ||= []).push(r); });
  return Object.fromEntries(Object.entries(m).map(([a,rs])=>[a,sumRows(rs)]));
}
function invCalc(i){
  const fbaQty = i.fba_available + i.reserved;
  const total = fbaQty + i.inbound + i.in_transit + i.local;
  const aged = i.age_181_270 + i.age_271;
  const ageTotal = i.age_0_90+i.age_91_180+i.age_181_270+i.age_271;
  return {fbaQty,total,fbaDays: fbaQty/i.daily_sales, totalDays: total/i.daily_sales,
    agedShare: ageTotal? aged/ageTotal : 0, value: total*i.unit_cost, fbaValue: fbaQty*i.unit_cost};
}
function adFor(month){
  return DATA.ads.filter(a => (month==="all"||a.month===month) && (S.line==="all"||a.line===S.line));
}
function spuList(){
  const seen=[]; DATA.asins.forEach(a=>{ if(inLine(a.asin) && !seen.some(s=>s.spu===a.spu)) seen.push({spu:a.spu,line:a.line}); });
  return seen;
}

/* ---------- alerts ---------- */
function test(r, v){ return r.op==="<" ? v < r.value : r.op===">" ? v > r.value : r.op===">=" ? v >= r.value : false; }
function fmtVal(r, v){ return r.unit==="%" ? (v).toFixed(1)+"%" : r.unit==="天" ? Math.round(v)+" 天" : v+" "+r.unit; }
function computeAlerts(){
  const out=[]; const m = S.month==="all" ? DATA.months[DATA.months.length-1] : S.month;
  const per = byAsin(m);
  const add=(rid, asin, v, period, extra="")=>{
    const r=rule(rid); if(!test(r,v)) return;
    out.push({key:`${period.replace(/-/g,"")}_${asin}_${rid}`, rid, asin, line:asinInfo[asin]?.line, spu:asinInfo[asin]?.spu,
      rule:r, value:fmtVal(r,v), threshold:`${r.op===">="?"≥":r.op} ${r.value}${r.unit==="%"?"%":" "+r.unit}`, period, extra});
  };
  Object.entries(per).forEach(([a,s])=>{
    const p = monthLabel(m);
    add("margin_low",a,s.profit/s.sales*100,m);
    add("tacos_high",a,s.ad/s.sales*100,m);
    add("refund_high",a,s.refund/s.sales*100,m);
  });
  // SPU ACOS -> attached to each ASIN in the SPU (shown once per SPU, first ASIN)
  const ads = adFor(m);
  spuList().forEach(({spu})=>{
    const rows = ads.filter(x=>x.spu===spu); const sp = rows.reduce((t,x)=>t+x.spend,0), as = rows.reduce((t,x)=>t+x.ad_sales,0);
    const first = DATA.asins.find(a=>a.spu===spu && inLine(a.asin));
    if(first && as>0) add("acos_high", first.asin, sp/as*100, m, `SPU ${spu}`);
  });
  DATA.inventory.filter(i=>inLine(i.asin)).forEach(i=>{
    const c=invCalc(i), p="INV"+DATA.inventory_date;
    add("stock_low",i.asin,c.fbaDays,p); add("stock_high",i.asin,c.totalDays,p); add("aged_high",i.asin,c.agedShare*100,p);
  });
  const lastW = DATA.weeks[DATA.weeks.length-1].week;
  DATA.targets.filter(t=>inLine(t.asin)).forEach(t=>{
    const ws = DATA.weekly.filter(w=>w.asin===t.asin);
    const last = ws[ws.length-1];
    add("daily_miss",t.asin,Math.round(last.daily/t.target_daily*1000)/10,lastW);
    let streak=0; for(let k=ws.length-1;k>=0 && ws[k].rank>t.target_rank;k--) streak++;
    add("rank_miss",t.asin,streak,lastW, `最新排名 #${last.rank} / 目标 #${t.target_rank}`);
  });
  const order={high:0,mid:1};
  return out.sort((a,b)=>order[a.rule.level]-order[b.rule.level] || LINES.indexOf(a.line)-LINES.indexOf(b.line));
}

    <td class="l">${lineTag(l)}</td><td>${usd0.format(c.sales)}</td>

    <td>${usd0.format(c.ad)}</td><td class="${c.ad/c.sales*100>rule("tacos_high").value?"bad":""}">${pct(c.ad/c.sales)}</td>
    <td>${pct(c.refund/c.sales)}</td><td>${usd0.format(iv)}</td>
    <td>${al?`<span class="pill ${ao?"high":"okp"}">${ao} 未完成 / ${al}</span>`:`<span class="pill okp">无</span>`}</td></tr>`).join("");
  // small multiples: monthly sales per line, shared scale
  const series = linesShown().map(l=>DATA.months.map(mm=>{ const s=sumRows(DATA.monthly.filter(r=>r.month===mm&&asinInfo[r.asin].line===l)); return {m:mm,sales:s.sales,margin:s.profit/s.sales}; }));
  const maxS = Math.max(...series.flat().map(x=>x.sales));
  const minis = linesShown().map((l,i)=>miniBars(l,series[i],maxS)).join("");
  return `<section class="mod" id="overview">
    <div class="mod-head"><div><h2>整体看板</h2><p>${monthLabel(m)}，${S.line==="all"?"四个重点品线":S.line}的经营概况。毛利已扣除采购、头程、FBA、佣金、广告、仓储、退款和促销。</p></div></div>

      <div class="tbl-wrap"><table><thead><tr><th class="l">品线</th><th>销售额</th><th>环比</th><th>销量</th><th>毛利</th><th>毛利率</th><th>广告费</th><th>TACOS</th><th>退款率</th><th>在库货值</th><th>预警</th></tr></thead><tbody>${tr}</tbody></table></div></div>
    <div class="card"><h3>月度销售额走势</h3><p class="note">2026 年 6–9 月，四个品线同一纵轴；柱上方为当月毛利率。</p><div class="minis">${minis}</div></div>
  </section>`;
}
function miniBars(l, pts, maxS){
  const W=260,H=120,pb=18,pt=18,bw=34,gap=(W-pts.length*bw)/(pts.length+1);
  const y=v=>H-pb-(v/maxS)*(H-pb-pt);
  const bars = pts.map((p,i)=>{ const x=gap+i*(bw+gap); const sel = p.m===S.month;
    return `<rect x="${x}" y="${y(p.sales)}" width="${bw}" height="${H-pb-y(p.sales)}" rx="3" fill="${LINE_COLOR[l]}" opacity="${S.month==="all"||sel?1:.45}"></rect>
    <text x="${x+bw/2}" y="${y(p.sales)-5}" text-anchor="middle">${(p.margin*100).toFixed(1)}%</text>
    <text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${+p.m.slice(5)}月</text>`; }).join("");
  const last=pts[pts.length-1];
  return `<div class="mini"><div class="t">${lineTag(l)}<span class="muted" style="font-weight:400">9 月 ${usd0.format(last.sales)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(l)}月度销售额"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"></line>${bars}</svg></div>`;
}

function renderAsin(){

  let body="";
  linesShown().forEach(l=>{
    const as = DATA.asins.filter(a=>a.line===l && per[a.asin]);
    if(!as.length) return;
    body += `<tr class="grp"><td class="l" colspan="18">${lineTag(l)}</td></tr>`;
    as.forEach(a=>{ body += asinRow(a, per[a.asin]); });

  });
  return `<section class="mod" id="asin">

    <tbody>${body}</tbody></table></div>

  </section>`;

function asinRow(a,s,isSub=false){
  const mg = s.profit/s.sales, tc = s.ad/s.sales;
  const parts = COST_PARTS.map(([k,n,c])=>{ const v = k==="storage" ? s.storage+s.aged_fee : s[k]; return `<span title="${n} ${pct(v/s.sales)}" style="width:${Math.max(0,v/s.sales*100)}%;background:${c}"></span>`; }).join("")
    + (mg>0?`<span style="width:${mg*100}%;background:var(--ok)"></span>`:"");
  return `<tr class="${isSub?"sub":""}"><td class="l mono">${esc(a.asin)}</td><td class="l">${isSub?esc(a.name):`<div>${esc(a.name)}</div><div class="muted" style="font-size:12px">${esc(a.spu)}</div>`}</td>
    <td>${int.format(s.units)}</td><td>${usd0.format(s.sales)}</td><td>${usd0.format(s.cogs)}</td><td>${usd0.format(s.freight)}</td><td>${usd0.format(s.fba)}</td>
    <td>${usd0.format(s.commission)}</td><td>${usd0.format(s.ad)}</td><td>${usd0.format(s.storage)}</td><td>${s.aged_fee?usd0.format(s.aged_fee):"—"}</td>
    <td>${usd0.format(s.refund)}</td><td>${usd0.format(s.promo)}</td><td class="${s.profit<0?"bad":""}">${usd0.format(s.profit)}</td>
    <td class="${mg*100<rule("margin_low").value?"bad":""}">${pct(mg)}</td><td class="${tc*100>rule("tacos_high").value?"bad":""}">${pct(tc)}</td>
    <td>${usd2.format(s.profit/s.units)}</td><td class="l"><div class="stack" aria-label="费用结构">${parts}</div></td></tr>`;
}

function renderAds(){
  const m=S.month; const ads=adFor(m); const types=[...new Set(DATA.ads.map(a=>a.type))];
  const spus = spuList();
  const salesBySpu = spu => sumRows(rowsFor(m, r=>asinInfo[r.asin].spu===spu)).sales;
  const legend = types.map((t,i)=>`<span><i style="background:${AD_COLORS[i]}"></i>${t}</span>`).join("");
  const maxSpend = Math.max(...spus.map(({spu})=>ads.filter(a=>a.spu===spu).reduce((t,a)=>t+a.spend,0)));
  const bars = spus.map(({spu,line})=>{
    const rows = ads.filter(a=>a.spu===spu); const tot = rows.reduce((t,a)=>t+a.spend,0);
    const seg = types.map((t,i)=>{ const v=rows.filter(r=>r.type===t).reduce((s,r)=>s+r.spend,0); return `<span title="${t} ${usd0.format(v)}" style="width:${v/tot*100}%;background:${AD_COLORS[i]}"></span>`; }).join("");
    return `<div style="display:grid;grid-template-columns:minmax(7rem,12rem) 1fr auto;gap:10px;align-items:center;font-size:13px">
      <div>${lineTag(line)} <span class="muted" style="font-size:12px">${esc(spu)}</span></div>
      <div style="width:${tot/maxSpend*100}%"><div class="stack" style="height:16px;min-width:0">${seg}</div></div>
      <div style="font-variant-numeric:tabular-nums">${usd0.format(tot)}</div></div>`;
  }).join("");
  let body="";
  spus.forEach(({spu,line})=>{
    const rows = ads.filter(a=>a.spu===spu); const tot = rows.reduce((t,a)=>t+a.spend,0);
    body += `<tr class="grp"><td class="l" colspan="12">${lineTag(line)}　${esc(spu)}</td></tr>`;
    const agg = t => { const rs=rows.filter(r=>r.type===t); return rs.reduce((o,r)=>{["spend","impressions","clicks","orders","ad_sales"].forEach(k=>o[k]+=r[k]);return o;},{spend:0,impressions:0,clicks:0,orders:0,ad_sales:0}); };
    const line_ = (name,o,cls="",extra="")=>{ const acos=o.ad_sales?o.spend/o.ad_sales:null;
      return `<tr class="${cls}"><td class="l">${name}</td><td>${usd0.format(o.spend)}</td><td>${pct(o.spend/tot)}</td><td>${int.format(o.impressions)}</td><td>${int.format(o.clicks)}</td>
      <td>${pct(o.clicks/o.impressions,2)}</td><td>${usd2.format(o.spend/o.clicks)}</td><td>${int.format(o.orders)}</td><td>${pct(o.orders/o.clicks)}</td>
      <td>${usd0.format(o.ad_sales)}</td><td class="${acos*100>rule("acos_high").value?"bad":""}">${pct(acos)}</td><td>${extra}</td></tr>`; };
    const total={spend:0,impressions:0,clicks:0,orders:0,ad_sales:0};
    types.forEach((t,i)=>{ const o=agg(t); Object.keys(total).forEach(k=>total[k]+=o[k]); body += line_(`<span class="lt"><i style="background:${AD_COLORS[i]}"></i>${t}</span>`,o); });
    const sales = salesBySpu(spu);
    body += line_("SPU 合计",total,"sub",`TACOS ${pct(total.spend/sales)} · 广告订单占比 ${pct(total.ad_sales/sales)}`);
  });
  return `<section class="mod" id="ads">
    <div class="mod-head"><div><h2>广告费用（按 SPU）</h2><p>${monthLabel(m)}。重点品线各 SPU 在 SP 自动 / 关键词 / ASIN 定投、SB、SBV、SD 上的花费结构和效率。</p></div></div>
    <div class="card"><h3>各 SPU 广告花费结构</h3><p class="note">条长 = 花费金额，颜色 = 广告类型。</p><div class="legend">${legend}</div><div style="display:grid;gap:8px">${bars}</div></div>
    <div class="card"><h3>广告结构明细</h3><p class="note">ACOS 超过 ${rule("acos_high").value}% 标红；TACOS 用 SPU 总销售额（含自然单）计算。</p>
    <div class="tbl-wrap"><table><thead><tr><th class="l">广告类型</th><th>花费</th><th>花费占比</th><th>曝光</th><th>点击</th><th>CTR</th><th>CPC</th><th>广告订单</th><th>CVR</th><th>广告销售额</th><th>ACOS</th><th>SPU 指标</th></tr></thead><tbody>${body}</tbody></table></div></div>
  </section>`;
}

          <td>${usd2.format(c.price)}</td><td class="${a.price<c.price?"ok":"warn"}">${a.price<c.price?"低 ":"高 "}${usd2.format(Math.abs(a.price-c.price))}</td>
          <td>${int.format(c.units)}</td><td>${daily.toFixed(0)}</td><td>#${c.sub_rank}</td><td>${int.format(c.bsr)}</td><td>${c.rating} · ${int.format(c.ratings)}</td><td>${c.nation}</td>
          <td>${pct(last.daily/daily,0)}</td></tr>`; }).join("");
      return `<div class="rank-block">
        <div class="rank-head"><span class="asin">${t.asin}</span><span>${esc(a.name)}</span><span class="muted">${usd2.format(a.price)}</span>
          <div class="tgt"><span>目标小类排名<b>#${t.target_rank}</b></span><span>目标日销<b>${t.target_daily}</b></span><span>最新周完成率<b class="${rate<rule("daily_miss").value/100?"bad":"ok"}">${pct(rate,0)}</b></span></div>
          <span class="muted" style="font-size:12px">小类：${esc(t.subcategory)} · 核心词：${esc(t.keyword)}</span></div>
        <div class="rank-body">
          <div class="tbl-wrap"><table><thead><tr>${weeks.map(w=>`<th style="text-align:center">${w.week}<br><span style="font-weight:400">${w.range}</span></th>`).join("")}</tr></thead><tbody><tr>${cells}</tr></tbody></table></div>
          <div class="comp-label">对标竞品（卖家精灵，近 30 天）</div>
          <div class="tbl-wrap"><table><thead><tr><th class="l">竞品 ASIN</th><th class="l">品牌</th><th class="l">产品</th><th>售价</th><th>我司价差</th><th>月销量</th><th>日均</th><th>小类排名</th><th>大类 BSR</th><th>评分 · 评论</th><th>卖家</th><th>我司日销 / 竞品</th></tr></thead><tbody>${comps}</tbody></table></div>
        </div></div>`;
    }).join("");
    return `<div><h3 style="font-size:15px;margin:4px 0 8px">${lineTag(l)}</h3>${inner}</div>`;
  }).join("");
  return `<section class="mod" id="rank">
    <div class="mod-head"><div><h2>竞对与目标排名</h2><p>每个核心 ASIN 的目标小类排名、目标日销和每周完成情况（绿色＝排名达标，红色＝未达标；格内为周日均销量和完成率），下方列出对标竞品。竞品数据为卖家精灵 ${DATA.competitor_date} 抓取的美国站近 30 天数据。</p></div></div>
    ${blocks}
  </section>`;
}

function renderRules(){
  const rs = rules();
  const ed = S.canEdit && S.db;
  const body = rs.map(r=>`<tr><td class="l"><b style="font-weight:500">${esc(r.name)}</b><div class="muted" style="font-size:12px">${esc(r.scope)}</div></td>
    <td class="l">${esc(r.metric)}<div class="formula">${esc(r.formula)}</div></td>
    <td>${esc(r.op==="<"?"低于":r.op===">"?"高于":"达到")}</td>
    <td>${ed?`<input type="number" id="th-${r.id}" step="any" value="${r.value}" aria-label="${esc(r.name)}阈值">`:`<b style="font-family:var(--font-num);font-size:17px">${r.value}</b>`} ${esc(r.unit)}</td>
    <td><span class="pill ${r.level==="high"?"high":"mid"}">${r.level==="high"?"高":"中"}</span></td>
    <td class="l">${esc(r.src)}</td></tr>`).join("");
  return `<section class="mod" id="rules">
    <div class="mod-head"><div><h2>监控规则</h2><p>预警模块按下面的规则自动判定。${ed?"你有编辑权限，可以直接改阈值并保存，所有人的预警列表会一起更新。":"阈值由负责人维护，如需调整请联系工作台负责人。"}</p></div>
    ${ed?`<button class="btn primary" id="save-rules">保存阈值</button>`:""}</div>
    <div class="card"><div class="tbl-wrap"><table class="rules"><thead><tr><th class="l">规则</th><th class="l">指标与口径</th><th>条件</th><th>阈值</th><th>级别</th><th class="l">数据来源</th></tr></thead><tbody>${body}</tbody></table></div></div>
    <div class="card"><h3>数据口径</h3><p class="note" style="margin:0">
    销售额为含税前订单金额；毛利 = 销售额 − 采购成本 − 头程 − FBA 配送费 − 佣金(15%) − 广告花费 − 月度仓储费 − 超龄附加费 − 退款 − 促销。
    TACOS = 广告花费 ÷ 总销售额；ACOS = 广告花费 ÷ 广告销售额。可售天数用近 30 天日均。
    排名为核心词所在小类的 BSR 小类排名，周数据取周日快照，日销为该周日均。竞品月销量、BSR、评分来自卖家精灵。</p></div>
  </section>`;
}

/* ---------- shell ---------- */
function renderControls(){
  $("#f-month").innerHTML = DATA.months.map(m=>`<option value="${m}">${m.slice(0,4)} 年 ${+m.slice(5)} 月</option>`).join("")+`<option value="all">6–9 月合计</option>`;
  $("#f-month").value = S.month;
  $("#f-line").innerHTML = [["all","全部品线"],...LINES.map(l=>[l,l])].map(([k,n])=>`<button class="chip" data-line="${k}" aria-pressed="${S.line===k}">${k!=="all"?`<span class="dot" style="background:${LINE_COLOR[k]}"></span>`:""}${n}</button>`).join("");
}
function renderTabs(){
  const open = computeAlerts().filter(a=>statusOf(a.key)==="open").length;
  $("#tabs").innerHTML = TABS.map(([id,n])=>`<button role="tab" id="tab-${id}" aria-selected="${S.tab===id}" data-tab="${id}">${n}${id==="alerts"&&open?`<span class="n">${open}</span>`:""}</button>`).join("");
}
const R = {overview:renderOverview, asin:renderAsin, ads:renderAds, stock:renderStock, alerts:renderAlerts, rank:renderRank, rules:renderRules};
function render(){
  if(S.tab==="alerts" && document.activeElement && document.activeElement.closest && document.activeElement.closest("#alert-table")){ S.pending=true; renderTabs(); return; }
  S.pending=false;
  renderTabs(); $("#view").innerHTML = R[S.tab]();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-line],[data-af],[data-act=save],#save-rules"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; try{localStorage.setItem("wb-tab",S.tab)}catch(_){} render(); window.scrollTo({top:0}); return; }
  if(t.dataset.line){ S.line=t.dataset.line; renderControls(); render(); return; }
  if(t.dataset.af){ S.alertFilter=t.dataset.af; render(); return; }
  if(t.dataset.act==="save"){ const tr=t.closest("tr"); saveAlert(tr.dataset.key, {status: tr.querySelector("[data-act=status]").value, note: tr.querySelector("[data-act=note]").value}, t); return; }
  if(t.id==="save-rules") saveRules(t);
});
$("#f-month").addEventListener("change", e=>{ S.month=e.target.value; render(); });
document.addEventListener("input", e=>{ if(e.target.dataset.act==="note"){ S.drafts[e.target.closest("tr").dataset.key]=e.target.value; } });
document.addEventListener("change", e=>{ if(e.target.dataset.act==="status"){ const tr=e.target.closest("tr"); saveAlert(tr.dataset.key,{status:e.target.value, note: tr.querySelector("[data-act=note]").value}); } });
document.addEventListener("focusout", e=>{ setTimeout(()=>{ if(S.pending && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("#alert-table"))) render(); },0); });

async function saveAlert(key, {status,note}, btn){
  if(!S.db) return;
  const a = computeAlerts().find(x=>x.key===key); if(!a) return;
  if(btn){ btn.disabled=true; btn.textContent="保存中"; }
  try{
    await S.db.collection("alerts").doc(key).set({status, note: note.slice(0,2000), by: S.uid, at: new Date().toISOString(),
      asin:a.asin, line:a.line, rule:a.rid, period:a.period, value:a.value});
    delete S.drafts[key]; toast("已保存");
  }catch(err){
    if(err && err.code==="invalid_argument"){ S.canWrite=false; toast("没有填写权限，已切换为只读"); }
    else toast("没保存成功，请稍后再试");
  }finally{ if(btn){ btn.disabled=false; btn.textContent="保存"; } if(document.activeElement===btn) btn.blur(); render(); }
}
async function saveRules(btn){
  const th={}; for(const r of DEFAULT_RULES){ const v=parseFloat($("#th-"+r.id)?.value); if(!isFinite(v)){ toast(`「${r.name}」阈值需要是数字`); return; } th[r.id]=v; }
  btn.disabled=true;
  try{ await S.db.doc("settings/rules").set({thresholds:th, by:S.uid, at:new Date().toISOString()}); toast("阈值已保存，预警已按新阈值更新"); }
  catch(err){ toast(err&&err.code==="invalid_argument" ? "只有编辑者可以修改阈值" : "没保存成功，请稍后再试"); }
  finally{ btn.disabled=false; }
}

async function resolveNames(){
  if(!S.user) return;
  const ids=[...new Set(Object.values(S.alertDocs).map(d=>d.by).filter(Boolean))].filter(id=>!(id in S.names));
  if(!ids.length) return;
  const ps = await S.user.profiles(ids);
  ids.forEach(id=>{ S.names[id] = (ps[id] && ps[id].name) || "同事"; });
  render();
}

async function boot(){
  renderControls(); render();
  if(!window.claude || !window.claude.use){ S.dbState="none"; render(); return; }
  const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  S.db=db; S.user=user; S.dbState = db ? "ready" : "none";
  if(user){ S.uid = await user.id(); S.canWrite = await user.can("data.write"); S.canEdit = await user.canEdit(); }
  render();
  if(!db) return;
  db.collection("alerts").onSnapshot(snap=>{
    S.alertDocs = Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));
    render(); resolveNames();
  }, ()=>{ S.dbState="none"; S.db=null; render(); });
  db.doc("settings/rules").onSnapshot(snap=>{
    S.thresholds = (snap.exists && snap.data().thresholds) || {};
    render();
  }, ()=>{});
}
boot();
</script>
