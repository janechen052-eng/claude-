  o.plugins.tooltip.callbacks={label:c=>' '+c.dataset.label+'  '+(c.raw*100).toFixed(2)+'%',footer:it=>'总 TACOS  '+(it.reduce((s,c)=>s+c.raw,0)*100).toFixed(1)+'%'};
  mk('tTacos',{type:'bar',data:{labels:PL,datasets:m.types.map(t=>({label:t,data:S.map(s=>s[t].tacos),backgroundColor:css(TT.find(x=>x[0]===t)[1]),borderColor:css('--surface'),borderWidth:{top:1},categoryPercentage:.6,barPercentage:.9}))},options:o});
  const R=m.rows,roll=t=>R.map((_,i)=>{if(i<6)return null;let s=0,a=0;for(let k=i-6;k<=i;k++){s+=R[k][t+'_spend'];a+=R[k][t+'_sales']}return s<1?null:(a?s/a:9.99)});
  o=base(PH,true);o.scales.y.min=0;o.scales.y.max=1;o.scales.y.ticks.callback=v=>(v*100).toFixed(0)+'%';
  o.plugins.tooltip.callbacks={label:c=>{const r=c.dataset.raw[c.dataIndex];return r==null?null:' '+c.dataset.label+'  '+(r>=9.99?'无广告销售':(r*100).toFixed(1)+'%')}};
  mk('tRoll',{type:'line',data:{labels:R.map(r=>r.d),datasets:m.types.map(t=>{const raw=roll(t),c=css(TT.find(x=>x[0]===t)[1]);return{label:t,raw,data:raw.map(v=>v==null?null:Math.min(v,1)),borderColor:c,backgroundColor:c,borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.25}})},options:o});
  const fi=Math.max(0,PH.map(p=>p.focus).lastIndexOf(true)),F=S[fi],tS=m.types.reduce((s,t)=>s+F[t].spend,0),tA=m.types.reduce((s,t)=>s+F[t].sales,0);
  o=tb();o.indexAxis='y';o.interaction={mode:'index',intersect:false};o.scales.x.ticks.callback=v=>(v*100).toFixed(0)+'%';o.scales.x.grid={color:css('--grid')};o.scales.y.grid={display:false};
  o.plugins.tooltip.callbacks={label:c=>' '+c.dataset.label+'  '+(c.raw*100).toFixed(1)+'%'};
  mk('tShare',{type:'bar',data:{labels:m.types,datasets:[{label:'花费占比',data:m.types.map(t=>div(F[t].spend,tS)),backgroundColor:m.types.map(t=>css(TT.find(x=>x[0]===t)[1])),categoryPercentage:.8,barPercentage:.9},
    {label:'广告销售额占比',data:m.types.map(t=>div(F[t].sales,tA)),backgroundColor:m.types.map(t=>css(TT.find(x=>x[0]===t)[1])+'66'),categoryPercentage:.8,barPercentage:.9}]},options:o});
  o=tb();o.scales.y.min=0;o.plugins.tooltip.callbacks={label:c=>' '+c.dataset.label+' ROAS  '+x2(c.raw)};
  mk('tRoas',{type:'bar',data:{labels:PL,datasets:m.types.map(t=>bar(t,S.map(s=>s[t].roas),css(TT.find(x=>x[0]===t)[1])))},options:o});
  document.getElementById('tTbl').innerHTML='<thead><tr>'+['阶段','类型','日均花费','花费占比','日均广告销售额','日均广告订单','ACOS','TACOS','ROAS','单均广告成本'].map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    S.map((s,i)=>m.types.map((t,j)=>{const r=s[t];return '<tr class="'+(PH[i].focus?'focus':'')+'"><td>'+(j?'':PL[i])+'</td><td>'+t+'</td><td>'+$2(r.spend)+'</td><td>'+pc(r.share)+'</td><td>'+$0(r.sales)+'</td><td>'+r.orders.toFixed(1)+'</td><td'+(r.acos>0.5?' class="up"':'')+'>'+pc(r.acos)+'</td><td>'+pc(r.tacos)+'</td><td>'+x2(r.roas)+'</td><td>'+$2(r.cpo)+'</td></tr>'}).join('')).join('')+'</tbody>'}
// ---------- plan vs actual
function planHTML(P){return `<section class="panel"><div><h2>加投方案 vs 实际执行偏差</h2><p class="sub">${esc(P.desc)}</p></div>
  <section class="find" id="pK"></section>
  <div class="legend"><span><i style="background:var(--plan)"></i>方案</span><span><i style="background:var(--s1)"></i>实际</span></div>
  <div class="grid2"><div><h3>增量月花费</h3><div class="chart" style="height:240px"><canvas id="pSpend" role="img" aria-label="增量花费"></canvas></div></div>
  <div><h3>增量广告订单（单/月）</h3><div class="chart" style="height:240px"><canvas id="pOrders" role="img" aria-label="增量订单"></canvas></div></div></div>
  <div class="grid2"><div><h3>每个增量广告订单的成本</h3><div class="chart" style="height:230px"><canvas id="pCpo" role="img" aria-label="增量单均成本"></canvas></div></div>
  <div><h3>每日广告费 vs 方案日预算</h3><div class="legend"><span><i style="background:var(--muted)"></i>基准 ${$0(P.plan.before.ad_spend/30)}/天</span><span><i style="background:var(--hi)"></i>方案 ${$0(P.plan.after.ad_spend/30)}/天</span></div>
  <div class="chart" style="height:210px"><canvas id="pDaily" role="img" aria-label="每日广告费与预算线"></canvas></div></div></div>
  <div class="grid2"><div><h3>增量 ROAS（增量广告销售额 ÷ 增量广告费）</h3><div class="chart" style="height:230px"><canvas id="pRoas" role="img" aria-label="增量ROAS"></canvas></div></div>
  <div><h3>利润率对比（方案 = 方案毛利口径，实际 = 订单毛利）</h3><div class="chart" style="height:230px"><canvas id="pMargin" role="img" aria-label="利润率对比"></canvas></div></div></div>
  <h3>投放动作明细（月度）</h3><div class="tbl"><table id="pLever"></table></div>
  <h3>利润影响：方案 vs 实际（月度）</h3><div class="tbl"><table id="pProfit"></table></div>
  ${(DATA.notes.plan||[]).length?'<ul class="notes">'+DATA.notes.plan.map(n=>'<li>'+n+'</li>').join('')+'</ul>':''}</section>`}
function drawPlan(P){const V=P.actual.vs_plan,L=V.levers,p=P.plan,a=P.actual,T=V.total,cm=p.contribution_margin;
  const K=[[$0(T.actual_spend),'实际月增广告费，方案 '+$0(T.plan_spend)+'（'+(T.plan_spend?((T.actual_spend/T.plan_spend-1)*100).toFixed(0)+'%':'')+'）',T.actual_spend>T.plan_spend*1.2],
    ['+'+n0(T.actual_ad_orders)+' 单','实际月增广告订单，方案 +'+n0(T.plan_orders)+'；全部订单 +'+n0(T.actual_all_orders),false],
    [$2(T.actual_cpo),'增量广告订单单均成本，方案 '+$2(T.plan_cpo),T.actual_cpo>T.plan_cpo*1.2],
    [x2(T.actual_roas),'增量 ROAS，方案 '+x2(T.plan_roas)+'；保本 ROAS '+x2(p.breakeven_roas),T.actual_roas<T.plan_roas]];
  document.getElementById('pK').innerHTML=K.map(k=>'<div><b'+(k[2]?' class="up"':'')+'>'+k[0]+'</b><span>'+k[1]+'</span></div>').join('');
  const lab=L.map(l=>l.name),pair=(id,pf,af,fmt,h)=>{const o=base([],false);o.plugins.bands=false;
    if(h){o.indexAxis='y';o.scales.x.ticks.callback=fmt;o.scales.x.grid={color:css('--grid')};o.scales.y.grid={display:false}}else o.scales.y.ticks.callback=fmt;
    o.plugins.tooltip.callbacks={label:c=>' '+c.dataset.label+'  '+(nn(c.raw)?'方案未包含':fmt(c.raw))};
    mk(id,{type:'bar',data:{labels:lab,datasets:[bar('方案',L.map(pf),css('--plan')),bar('实际',L.map(af),css('--s1'))]},options:o})};
  pair('pSpend',l=>l.plan_spend,l=>l.actual_spend,v=>'$'+Math.round(v).toLocaleString());
  pair('pOrders',l=>l.plan_orders,l=>l.actual_orders,v=>Math.round(v)+' 单');
  pair('pCpo',l=>l.plan_cpo,l=>l.actual_cpo,v=>'$'+v.toFixed(2),true);
  pair('pRoas',l=>l.plan_roas,l=>l.actual_roas,v=>v.toFixed(2));
  const D=P.daily,o=base([],false);o.plugins.bands=false;o.scales.x.stacked=o.scales.y.stacked=true;o.scales.y.ticks.callback=v=>'$'+v;
  o.plugins.tooltip.callbacks={label:c=>' '+c.dataset.label+'  $'+c.raw.toFixed(0),footer:it=>'合计  $'+it.reduce((s,c)=>s+c.raw,0).toFixed(0)};
  o.plugins.refLines={lines:[[p.before.ad_spend/30,css('--muted')],[p.after.ad_spend/30,css('--hi')]],start:D.findIndex(r=>r.d===P.post_start),startLabel:P.post_start+' 执行'};
  mk('pDaily',{type:'bar',data:{labels:D.map(r=>r.d),datasets:TT.map(([t,c])=>({label:t,data:D.map(r=>r[t]),backgroundColor:css(c),categoryPercentage:.85,barPercentage:.9}))},options:o});
  const pre=a.monthly_pre,post=a.monthly_post,d=a.delta,rp=a.ratios_pre,rq=a.ratios_post,pr=a.profit;
  const mo=base([],false);mo.plugins.bands=false;mo.scales.y.min=0;mo.scales.y.ticks.callback=v=>(v*100).toFixed(0)+'%';mo.scales.x.ticks.autoSkip=false;mo.scales.x.ticks.font={family:css('--sans'),size:11};
  mo.plugins.tooltip.callbacks={label:c=>' '+c.dataset.label+'  '+(c.raw*100).toFixed(2)+'%'};
  mk('pMargin',{type:'bar',data:{labels:['执行前毛利率','执行后毛利率','增量利润率（全部）','增量利润率（广告口径）'],datasets:[
    bar('方案',[p.before.gp_rate,p.after.gp_rate,p.incremental.marginal_margin,p.incremental.marginal_margin],css('--plan')),
    bar('实际',[rp.order_gp_rate,rq.order_gp_rate,pr.order_gp_margin_on_incremental_sales,pr.ad_marginal_margin],css('--s1'))]},options:mo});
  const dev=(x,y)=>x?(y>=x?'+':'')+((y/x-1)*100).toFixed(0)+'%':'方案外';
  document.getElementById('pLever').innerHTML='<thead><tr>'+['动作','方案花费','实际花费','花费偏差','方案订单','实际广告订单','订单偏差','方案单均成本','实际单均成本','方案 ROAS','实际 ROAS'].map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    L.map(l=>'<tr><td>'+esc(l.name)+(l.plan_levers.length?'<br><span class="foot">'+esc(l.plan_levers.join(' + '))+'</span>':'')+'</td><td>'+$0(l.plan_spend)+'</td><td>'+$0(l.actual_spend)+'</td><td class="up">'+dev(l.plan_spend,l.actual_spend)+'</td><td>'+n0(l.plan_orders)+'</td><td>'+n0(l.actual_orders)+'</td><td>'+dev(l.plan_orders,l.actual_orders)+'</td><td>'+$2(l.plan_cpo)+'</td><td'+(l.actual_cpo>(T.plan_cpo||1e9)*1.3?' class="up"':'')+'>'+$2(l.actual_cpo)+'</td><td>'+x2(l.plan_roas)+'</td><td'+(l.actual_roas<p.breakeven_roas?' class="up"':'')+'>'+x2(l.actual_roas)+'</td></tr>').join('')+
    '<tr class="focus"><td>合计</td><td>'+$0(T.plan_spend)+'</td><td>'+$0(T.actual_spend)+'</td><td class="up">'+dev(T.plan_spend,T.actual_spend)+'</td><td>'+n0(T.plan_orders)+'</td><td>'+n0(T.actual_ad_orders)+'</td><td>'+dev(T.plan_orders,T.actual_ad_orders)+'</td><td>'+$2(T.plan_cpo)+'</td><td>'+$2(T.actual_cpo)+'</td><td>'+x2(T.plan_roas)+'</td><td>'+x2(T.actual_roas)+'</td></tr></tbody>';
  const pt=(x,y)=>((y-x)*100>=0?'+':'')+((y-x)*100).toFixed(2)+'pt';
  const rows=[['月销售额',$0(p.before.sales)+' → '+$0(p.after.sales),'+'+$0(p.total.sales),$0(pre['销售额'])+' → '+$0(post['销售额']),'+'+$0(d['销售额'])],
    ['月广告花费',$0(p.before.ad_spend)+' → '+$0(p.after.ad_spend),'+'+$0(p.total.spend),$0(pre['广告花费'])+' → '+$0(post['广告花费']),'+'+$0(d['广告花费'])],
    ['TACOS',pc(p.before.tacos)+' → '+pc(p.after.tacos),pt(p.before.tacos,p.after.tacos),pc(rp.tacos)+' → '+pc(rq.tacos),pt(rp.tacos,rq.tacos)],
    ['总销售额 ÷ 广告费',x2(p.before.roas_total)+' → '+x2(p.after.roas_total),'',x2(rp.roas_total)+' → '+x2(rq.roas_total),''],
    ['广告 ROAS','–','',x2(rp.roas_ad)+' → '+x2(rq.roas_ad),''],
    ['增量订单','','+'+n0(p.total.orders),'','全部 +'+n0(d['订单量'])+'；广告 +'+n0(d['广告订单量'])],
    ['毛利（率）',$0(p.before.gp)+'（'+pc(p.before.gp_rate)+'）→ '+$0(p.after.gp)+'（'+pc(p.after.gp_rate)+'）',pt(p.before.gp_rate,p.after.gp_rate),'订单毛利 '+$0(pre['订单毛利润'])+'（'+pc(rp.order_gp_rate)+'）→ '+$0(post['订单毛利润'])+'（'+pc(rq.order_gp_rate)+'）','+'+$0(d['订单毛利润'])+' / '+pt(rp.order_gp_rate,rq.order_gp_rate)],
    ['结算毛利（参考）','','',$0(pre['结算毛利润'])+' → '+$0(post['结算毛利润']),'受结算周期影响'],
    ['广告带来的增量利润','增量销售额 × '+pc(cm)+' − 增量广告费',$0(p.incremental.profit),'增量广告销售额 × '+pc(cm)+' − 增量广告费',$0(pr.ad_attributed_profit)],
    ['增量订单边际利润','',$2(p.incremental.profit_per_order)+'/单','广告口径',$2(pr.ad_profit_per_order)+'/单'],
    ['增量利润率','',pc(p.incremental.marginal_margin),'全部 / 广告口径',pc(pr.order_gp_margin_on_incremental_sales)+' / '+pc(pr.ad_marginal_margin)],
    ['CTR','','',pc(rp.ctr)+' → '+pc(rq.ctr),pt(rp.ctr,rq.ctr)],['CPC','','',$2(rp.cpc)+' → '+$2(rq.cpc),''],['广告 CVR','','',pc(rp.ad_cvr)+' → '+pc(rq.ad_cvr),pt(rp.ad_cvr,rq.ad_cvr)]];
  document.getElementById('pProfit').innerHTML='<thead><tr><th>指标</th><th>方案（前 → 后）</th><th>方案变化</th><th>实际（前 → 后）</th><th>实际变化</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i===4?'<b>'+c+'</b>':c)+'</td>').join('')+'</tr>').join('')+'</tbody>'}
// ---------- boot
function render(){charts.splice(0).forEach(c=>c.destroy());
  document.getElementById('hTitle').textContent=DATA.title;document.getElementById('hSub').textContent=DATA.subtitle;
  document.getElementById('kpis').innerHTML=(DATA.kpis||[]).map(k=>'<div><b>'+esc(k.v)+'</b><span>'+esc(k.t)+'</span></div>').join('');
  document.getElementById('kpis').hidden=!(DATA.kpis||[]).length;
  document.getElementById('markets').innerHTML=DATA.markets.map(marketHTML).join('');
  DATA.markets.forEach(drawMarket);
  const tm=DATA.markets.find(m=>m.types.length>1);
  document.getElementById('typesWrap').innerHTML=tm?typesHTML(tm):'';if(tm)drawTypes(tm);
  document.getElementById('planWrap').innerHTML=DATA.plan?planHTML(DATA.plan):'';if(DATA.plan)drawPlan(DATA.plan);
  const sn=DATA.notes.summary||[];document.getElementById('summary').hidden=!sn.length&&!DATA.foot;
  document.getElementById('sumNotes').innerHTML=sn.map(n=>'<li>'+n+'</li>').join('');document.getElementById('foot').textContent=DATA.foot||''}
render();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
